[project]
name = "pi-agent"
version = "0.1.0"
description = "Lightweight system + process monitoring agent for Raspberry Pi"
authors = [
    {name = "hiemenz",email = "kevinhiemenz1@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "fastapi (>=0.140.13,<0.141.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "boto3 (>=1.35.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
